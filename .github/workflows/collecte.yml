# Toutes les 30 min : collecte des flux, puis publication du dossier site/ sur Cloudflare Pages (nutizie.pages.dev, gratuit).
name: Collecte des flux
on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch: {}      # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]         # republie aussitôt après une modification du dépôt
permissions:
  contents: read
concurrency:
  group: deploiement
  cancel-in-progress: false   # ne coupe pas un déploiement en cours
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4   # titres du Journal de la Corse déjà lus : jamais redemandés
        with:
          path: cache
          key: titres-${{ github.run_id }}
          restore-keys: titres-
      - run: python3 outils/test_collecte.py
      - run: python3 collecte.py
      # Cloudflare gratuit ≈ 500 mises en ligne/mois : le passage des 30 min ne publie que s'il y a un article nouveau ou modifié
      - id: neuf
        run: |
          python3 -c "import json,hashlib;d=json.load(open('site/data.json'));print(hashlib.sha1(json.dumps(sorted([a['lien'],a['titre']] for a in d['articles'])).encode()).hexdigest())" > empreinte.txt
          if [ "$GITHUB_EVENT_NAME" = schedule ] && cmp -s empreinte.txt cache/empreinte.txt; then echo publier=non; else echo publier=oui; fi >> "$GITHUB_OUTPUT"
      - if: steps.neuf.outputs.publier == 'oui'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=nutizie --branch=main
      - run: cp empreinte.txt cache/empreinte.txt   # après la mise en ligne : un échec sera retenté au passage suivant
