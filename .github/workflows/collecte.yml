# Toutes les 30 min : collecte des flux, puis publication du dossier site/ sur Cloudflare Pages (nutizie.pages.dev, gratuit).
name: Collecte des flux
on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch: {}      # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]         # republie aussitôt après une modification du dépôt
permissions:
  contents: read
concurrency:
  group: deploiement
  cancel-in-progress: false   # ne coupe pas un déploiement en cours
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4   # titres du Journal de la Corse déjà lus : jamais redemandés
        with:
          path: cache
          key: titres-${{ github.run_id }}
          restore-keys: titres-
      - run: python3 outils/test_collecte.py
      - run: python3 collecte.py
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=nutizie --branch=main
